# App + Postgres. Dev: `docker compose up -d db`, then `pnpm db:migrate && pnpm dev`.
# Self-host: `docker compose up -d --build` — see the README.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openweek
      # Read only when the data directory is initialised — set it in .env before the first
      # start; changing it later needs an ALTER USER in the container.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openweek}
      POSTGRES_DB: openweek
    ports:
      # Loopback-bound: the app reaches the db over the compose network, so publishing it is
      # only for psql from the host. Without 127.0.0.1 this exposes Postgres on every interface.
      - "127.0.0.1:${OPENWEEK_DB_PORT:-5432}:5432"
    volumes:
      - openweek-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openweek -d openweek"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openweek:${POSTGRES_PASSWORD:-openweek}@db:5432/openweek
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OPENWEEK_ENCRYPTION_KEY: ${OPENWEEK_ENCRYPTION_KEY:?set OPENWEEK_ENCRYPTION_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${OPENWEEK_PORT:-3000}:3000"

volumes:
  openweek-db:
